<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kalikastore.in</title>
    <script type="text/javascript">
      // Simple SPA redirect for GitHub Pages
      var l = window.location;
      // If we are on a path that doesn't exist, redirect to the root with the path as a hash
      // This is less needed with HashRouter, but keeps things clean if people hit old links
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/#/' +
        l.pathname.slice(1)
      );
    </script>
  </head>
  <body>
  </body>
</html>
